name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same branch cancels the previous run, so a busy afternoon
# does not queue up five stale runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: API contract is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Lint the OpenAPI contract
        run: npx --yes @redocly/cli lint contracts/openapi.yaml --skip-rule no-empty-servers

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This check must come BEFORE setup-node. setup-node's `cache` option
      # fails the whole job when the lockfile it keys on does not exist, and
      # it runs before any later step could skip it.
      - name: Is the backend set up yet?
        id: check
        run: |
          if [ -f backend/package-lock.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No backend/package-lock.json yet - skipping." >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.check.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        if: steps.check.outputs.ready == 'true'
        working-directory: backend
        run: npm ci

      # Prisma's client must be generated before anything imports it, or every
      # test fails on "did not initialize yet".
      - name: Generate Prisma client
        if: steps.check.outputs.ready == 'true'
        working-directory: backend
        run: npx prisma generate

      - name: Typecheck
        if: steps.check.outputs.ready == 'true'
        working-directory: backend
        run: npm run typecheck --if-present

      - name: Test
        if: steps.check.outputs.ready == 'true'
        working-directory: backend
        run: npm test --if-present
        env:
          NODE_ENV: test
          JWT_SECRET: ci-secret-at-least-16-characters
          SERVICE_KEY: ci-service-key
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Is the frontend set up yet?
        id: check
        run: |
          if [ -f frontend/package-lock.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No frontend/package-lock.json yet - skipping until Prism scaffolds it." >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.check.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        if: steps.check.outputs.ready == 'true'
        working-directory: frontend
        run: npm ci

      - name: Test
        if: steps.check.outputs.ready == 'true'
        working-directory: frontend
        run: npm test --if-present

      - name: Build
        if: steps.check.outputs.ready == 'true'
        working-directory: frontend
        run: npm run build --if-present
