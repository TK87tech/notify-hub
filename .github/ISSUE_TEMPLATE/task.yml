name: Task
description: A piece of work from one of the 11 stages
title: "[Stage N] "
labels: []
body:
  - type: textarea
    id: goal
    attributes:
      label: What needs to happen
      placeholder: One or two sentences describing the outcome, not the steps.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: A short checklist. If you cannot write it, the task is not clear enough yet.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: dropdown
    id: owner
    attributes:
      label: Owner
      options: [Bell, Relay, Ember, Pulse, Beacon, Prism, Warden, Unassigned]
    validations:
      required: true
  - type: textarea
    id: blocked
    attributes:
      label: Blocked by
      placeholder: "#12, or 'nothing'"
